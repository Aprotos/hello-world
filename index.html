<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #e0e0e0;
      padding: 1rem;
    }

    .card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 24px 48px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 40%, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    p {
      opacity: 0.6;
      font-size: 0.95rem;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 0.9rem 1.25rem;
      color: #e0e0e0;
      text-decoration: none;
      font-size: 0.95rem;
      transition: background 0.15s, border-color 0.15s;
    }

    .nav-btn:hover {
      background: rgba(147,197,253,0.12);
      border-color: rgba(147,197,253,0.35);
    }

    .nav-btn .icon { font-size: 1.4rem; }
    .nav-btn .label { font-weight: 600; }
    .nav-btn .sub { font-size: 0.78rem; opacity: 0.55; margin-top: 0.1rem; }
    .nav-btn-text { text-align: left; }
  </style>
</head>
<body>
<div class="card">
  <h1>Hello World</h1>
  <p>Andrew's introductory repository. Explore the pages below.</p>

  <nav class="nav">
    <a href="weather.html" class="nav-btn">
      <span class="icon">⛅</span>
      <div class="nav-btn-text">
        <div class="label">Weather Forecast</div>
        <div class="sub">Live forecast for your current location</div>
      </div>
    </a>
  </nav>
</div>
</body>
</html>
